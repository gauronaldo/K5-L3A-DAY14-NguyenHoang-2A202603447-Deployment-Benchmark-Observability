# Render Blueprint — agent (Docker) + Redis (Key Value).
# Khi dùng Blueprint từ repo, đặt "Blueprint path" = 06-lab-complete/render.yaml
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh, không ghi giá trị trong repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: agent-redis
    plan: free
    region: singapore
    ipAllowList: []                  # chỉ cho truy cập nội bộ
    maxmemoryPolicy: noeviction
