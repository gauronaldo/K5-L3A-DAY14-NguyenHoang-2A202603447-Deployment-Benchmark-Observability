# Railway — build từ Dockerfile, healthcheck /health.
# PORT do Railway cấp, CMD trong Dockerfile đọc ${PORT:-8000}.
# Biến môi trường (AGENT_API_KEY, REDIS_URL, ...) đặt trên dashboard / `railway variables`,
# REDIS_URL tham chiếu tới service Redis: ${{Redis.REDIS_URL}}

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
